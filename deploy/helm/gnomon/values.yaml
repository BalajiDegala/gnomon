nameOverride: ''
fullnameOverride: ''

imagePullSecrets: []

web:
  replicaCount: 1
  image:
    repository: gnomon-web
    tag: '0.11.0'
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

adminSeed:
  enabled: false
  image:
    repository: gnomon-admin-seed
    tag: '0.11.0'
    pullPolicy: IfNotPresent
  # Optional command override. Lets the seed run from the API image, which
  # bundles dist/scripts/seed-admin.js, instead of a separate seed image.
  command: []

api:
  replicaCount: 1
  image:
    repository: gnomon-api
    tag: '0.11.0'
    pullPolicy: IfNotPresent
  webOrigin: http://gnomon.local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mongodb:
  image:
    repository: mongo
    tag: '4.4.29'
    pullPolicy: IfNotPresent
  storage: 10Gi
  storageClassName: local-path
  # MongoDB 4.4 sizes its cache from host RAM, not the container limit; pin it well
  # below the memory limit so the pod is not OOM-killed.
  wiredTigerCacheSizeGB: 0.5
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 2Gi

# Nightly mongodump of the gnomon database to a local-storage volume.
backup:
  enabled: false
  schedule: '30 1 * * *'
  timeZone: Asia/Kolkata
  retentionDays: 14
  storage: 50Gi
  # Pre-created local PersistentVolume class (see deploy/kubernetes/storage.yaml).
  storageClassName: local-path
  # Bind to a specific pre-created PV; leave empty for dynamic provisioning.
  volumeName: ''
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: gnomon.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
  tls: []

# Pass these with a private values file or --set-string. Never commit real values.
secrets:
  existingSecret: ''
  accessTokenSecret: ''
  refreshTokenSecret: ''
  mongodbRootPassword: ''
  mongodbUri: ''
  # Optional (min 32 chars). Encrypts the stored SMTP password independently of
  # ACCESS_TOKEN_SECRET. Read from SETTINGS_ENCRYPTION_KEY in the secret if present.
  settingsEncryptionKey: ''
  adminEmail: ''
  adminPassword: ''
  adminEmployeeCode: DDI0001
