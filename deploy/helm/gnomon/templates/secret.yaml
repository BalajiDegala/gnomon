{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gnomon.fullname" . }}
  labels:
    {{- include "gnomon.labels" . | nindent 4 }}
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: {{ required "secrets.accessTokenSecret is required" .Values.secrets.accessTokenSecret | quote }}
  REFRESH_TOKEN_SECRET: {{ required "secrets.refreshTokenSecret is required" .Values.secrets.refreshTokenSecret | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "secrets.mongodbRootPassword is required" .Values.secrets.mongodbRootPassword | quote }}
  MONGODB_URI: {{ required "secrets.mongodbUri is required" .Values.secrets.mongodbUri | quote }}
  {{- if .Values.adminSeed.enabled }}
  ADMIN_EMAIL: {{ required "secrets.adminEmail is required when adminSeed is enabled" .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required when adminSeed is enabled" .Values.secrets.adminPassword | quote }}
  ADMIN_EMPLOYEE_CODE: {{ .Values.secrets.adminEmployeeCode | quote }}
  {{- end }}
{{- end }}
