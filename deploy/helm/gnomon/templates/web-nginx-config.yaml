apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gnomon.fullname" . }}-web-nginx
  labels:
    {{- include "gnomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      gzip on;
      gzip_comp_level 5;
      gzip_min_length 1024;
      gzip_proxied any;
      gzip_vary on;
      gzip_types text/plain text/css application/javascript application/json image/svg+xml;

      location /api/ {
        proxy_pass http://{{ include "gnomon.fullname" . }}-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      # index.html must always be revalidated so browsers pick up new releases.
      location = /index.html {
        add_header Cache-Control "no-cache" always;
      }

      # Vite asset names contain a content hash, so they can be cached for good.
      location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
