{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gnomon.fullname" . }}-mongodb-backups
  labels:
    {{- include "gnomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-backup
  annotations:
    # Keep existing backups if the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.backup.storageClassName }}
  storageClassName: {{ .Values.backup.storageClassName | quote }}
  {{- end }}
  {{- if .Values.backup.volumeName }}
  volumeName: {{ .Values.backup.volumeName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "gnomon.fullname" . }}-mongodb-backup
  labels:
    {{- include "gnomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- with .Values.backup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "gnomon.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: mongodb-backup
        spec:
          restartPolicy: Never
          containers:
            - name: mongodump
              image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
              imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
              command: ["/bin/bash", "-ceu"]
              args:
                - |
                  stamp="$(date +%Y%m%d-%H%M%S)"
                  target="/backups/gnomon-${stamp}.archive.gz"
                  echo "Dumping to ${target}"
                  mongodump --uri="${MONGODB_URI}" --gzip --archive="${target}.partial"
                  mv "${target}.partial" "${target}"
                  ls -lh "${target}"
                  find /backups -maxdepth 1 -name 'gnomon-*.archive.gz' -mtime +"${RETENTION_DAYS}" -print -delete
                  find /backups -maxdepth 1 -name '*.partial' -mmin +120 -delete
              env:
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "gnomon.secretName" . }}
                      key: MONGODB_URI
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "gnomon.fullname" . }}-mongodb-backups
{{- end }}
