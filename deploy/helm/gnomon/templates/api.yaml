apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gnomon.fullname" . }}-api
  labels:
    {{- include "gnomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gnomon.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gnomon.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: WEB_ORIGIN
              value: {{ .Values.api.webOrigin | quote }}
            - name: COOKIE_SECURE
              value: {{ ternary "true" "false" (gt (len .Values.ingress.tls) 0) | quote }}
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gnomon.secretName" . }}
                  key: ACCESS_TOKEN_SECRET
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gnomon.secretName" . }}
                  key: REFRESH_TOKEN_SECRET
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "gnomon.secretName" . }}
                  key: MONGODB_URI
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gnomon.fullname" . }}-api
  labels:
    {{- include "gnomon.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "gnomon.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4000
      targetPort: http
