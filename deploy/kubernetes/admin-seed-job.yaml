# Optional, NOT in kustomization.yaml. Creates the first admin user once.
# It RESETS the admin password to ADMIN_PASSWORD whenever it runs.
# Set the image to the same repository:tag as kustomization.yaml, then:
#   kubectl apply -f admin-seed-job.yaml
#   kubectl -n gnomon logs -f job/gnomon-admin-seed && kubectl -n gnomon delete job gnomon-admin-seed
# Uses the API image (it bundles dist/scripts/seed-admin.js); keep the tag in step
# with kustomization.yaml. Reads ADMIN_EMAIL / ADMIN_PASSWORD / ADMIN_EMPLOYEE_CODE.
apiVersion: batch/v1
kind: Job
metadata:
  name: gnomon-admin-seed
  namespace: gnomon
  labels:
    app.kubernetes.io/name: gnomon
    app.kubernetes.io/component: admin-seed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnomon
        app.kubernetes.io/component: admin-seed
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
        - name: seed
          image: docker.io/DOCKERHUB_USER/gnomon-api:0.11.0
          imagePullPolicy: IfNotPresent
          command: ['node', 'apps/api/dist/scripts/seed-admin.js']
          envFrom:
            - secretRef:
                name: gnomon-secrets
