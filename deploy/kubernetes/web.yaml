apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnomon-web
  labels:
    app.kubernetes.io/name: gnomon
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gnomon
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnomon
        app.kubernetes.io/component: web
    spec:
      # Private Docker Hub repositories; see docs/DOCKERHUB_DEPLOYMENT_RUNBOOK.md.
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
        - name: web
          image: gnomon-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: gnomon-web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gnomon-web
  labels:
    app.kubernetes.io/name: gnomon
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: gnomon
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
