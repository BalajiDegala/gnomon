# NOT applied by kustomization.yaml. Copy, fill in, apply once, never commit:
#   cp secret.example.yaml secret.local.yaml && $EDITOR secret.local.yaml
#   kubectl apply -f secret.local.yaml
# Generate values with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: gnomon-secrets
  namespace: gnomon
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: change-me-at-least-32-characters-long
  REFRESH_TOKEN_SECRET: change-me-at-least-32-characters-long
  # Optional, >= 32 chars: encrypts the stored SMTP password.
  SETTINGS_ENCRYPTION_KEY: change-me-at-least-32-characters-long
  MONGO_INITDB_ROOT_PASSWORD: change-me
  # Must use the same password as MONGO_INITDB_ROOT_PASSWORD.
  MONGODB_URI: mongodb://gnomonadmin:change-me@gnomon-mongodb-0.gnomon-mongodb:27017/gnomon?authSource=admin
  # Only used by admin-seed-job.yaml.
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: change-me
  ADMIN_EMPLOYEE_CODE: DDI0001
