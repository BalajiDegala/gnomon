apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gnomon-mongodb-backups
  labels:
    app.kubernetes.io/name: gnomon
    app.kubernetes.io/component: mongodb-backup
spec:
  accessModes: ['ReadWriteOnce']
  storageClassName: gnomon-local
  volumeName: gnomon-k8s-backups
  resources:
    requests:
      storage: 50Gi
---
# Nightly gzip'd mongodump archive; archives older than RETENTION_DAYS are deleted.
# Run one now:   kubectl -n gnomon create job --from=cronjob/gnomon-mongodb-backup backup-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gnomon-mongodb-backup
  labels:
    app.kubernetes.io/name: gnomon
    app.kubernetes.io/component: mongodb-backup
spec:
  schedule: '30 1 * * *'
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gnomon
            app.kubernetes.io/component: mongodb-backup
        spec:
          restartPolicy: Never
          containers:
            - name: mongodump
              image: mongo:4.4.29
              imagePullPolicy: IfNotPresent
              command: ['/bin/bash', '-ceu']
              args:
                - |
                  stamp="$(date +%Y%m%d-%H%M%S)"
                  target="/backups/gnomon-${stamp}.archive.gz"
                  echo "Dumping to ${target}"
                  mongodump --uri="${MONGODB_URI}" --gzip --archive="${target}.partial"
                  mv "${target}.partial" "${target}"
                  ls -lh "${target}"
                  find /backups -maxdepth 1 -name 'gnomon-*.archive.gz' -mtime +"${RETENTION_DAYS}" -print -delete
                  find /backups -maxdepth 1 -name '*.partial' -mmin +120 -delete
              env:
                - name: RETENTION_DAYS
                  value: '14'
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: gnomon-secrets
                      key: MONGODB_URI
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: gnomon-mongodb-backups
