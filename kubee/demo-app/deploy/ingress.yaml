apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cicd-demo
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: cicd-demo.d2-india.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cicd-demo
                port:
                  name: http
